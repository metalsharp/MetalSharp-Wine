name: WineMetalGL release

# A release is cut when a commit on main carries a project() version in
# CMakeLists.txt that has no winemetalgl-<version> tag yet: bumping the
# version in a pull request releases it when that pull request merges.
# Pull requests never run this workflow, so their code never sees the
# signing secrets.
on:
  push:
    branches: [main]
    paths: [CMakeLists.txt]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winemetalgl-release
  cancel-in-progress: false

jobs:
  version:
    name: Check for a new version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read the version and look for its tag
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(WineMetalGL VERSION \([0-9][0-9.]*\) .*/\1/p' CMakeLists.txt)
          test -n "$version" || { echo "no project() version in CMakeLists.txt"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if test "$GITHUB_REF" != refs/heads/main; then
            echo "Releases are made from main only (this run is on $GITHUB_REF)."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/winemetalgl-$version" >/dev/null; then
            echo "winemetalgl-$version is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing winemetalgl-$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Sign, notarize and publish ${{ needs.version.outputs.version }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      LLVM_MINGW: llvm-mingw-20260922-ucrt-macos-universal
      LLVM_MINGW_SHA256: 52e5f5a7b131021d0c39a37a38fa380a1da7885cd04bd61afd0cd4ecfb8bc1f3
      WINE_SHA256: c07a6857933c1fc60dff5448d79f39c92481c1e9db5aa628db9d0358446e0701
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch llvm-mingw and the Wine 11.0 headers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deps"
          cd "$RUNNER_TEMP/deps"
          curl -fsSL -o llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  llvm-mingw.tar.xz" | shasum -a 256 -c -
          tar -xJf llvm-mingw.tar.xz
          curl -fsSL -o wine.tar.xz https://dl.winehq.org/wine/source/11.0/wine-11.0.tar.xz
          echo "$WINE_SHA256  wine.tar.xz" | shasum -a 256 -c -
          tar -xJf wine.tar.xz wine-11.0/include
          echo "$RUNNER_TEMP/deps/$LLVM_MINGW/bin" >> "$GITHUB_PATH"

      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD; do
            test -n "${!name}" || { echo "missing secret $name"; exit 1; }
          done
          keychain="$RUNNER_TEMP/winemetalgl-signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A \
            -T /usr/bin/codesign -T /usr/bin/security -k "$keychain"
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Keep the existing keychains (with Apple's intermediates) in the search list.
          existing=()
          while read -r k; do
            k="${k//\"/}"
            [ -n "$k" ] && [ "$k" != "$keychain" ] || continue
            existing+=("$k")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application:/ {print $2; exit}')
          test -n "$identity" || { echo "the certificate holds no Developer ID Application identity"; exit 1; }
          echo "Signing as $identity"
          echo "WINEMETALGL_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Stage the x86_64 release (Wine module and core)
        run: scripts/stage-release.sh "$RUNNER_TEMP/deps/wine-11.0" "$RUNNER_TEMP/out/winemetalgl-$VERSION-x86_64"

      # The native games' glue links against stand-ins for their SDL2, SDL3
      # and GLFW (scripts/build-arm64-glue.sh).
      - name: Stage the arm64 core
        run: |
          brew install sdl2 sdl3 glfw
          WINEMETALGL_REQUIRE_GLUE=1 scripts/stage-arm64-core.sh "$RUNNER_TEMP/out/winemetalgl-$VERSION-arm64-core"

      # The Wine module for a native arm64 Wine (CrossOver 27, MetalSharp's Wine), with the arm64 core.
      - name: Stage the arm64 Wine release (Wine module and core)
        run: scripts/stage-release-arm64.sh "$RUNNER_TEMP/deps/wine-11.0" "$RUNNER_TEMP/out/winemetalgl-$VERSION-arm64"

      - name: Notarize the signed libraries
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "missing secret $name"; exit 1; }
          done
          out="$RUNNER_TEMP/out"
          mkdir -p "$RUNNER_TEMP/notarize"
          cp "$out/winemetalgl-$VERSION-x86_64/module/x86_64-unix/libwinemetalgl.dylib" "$RUNNER_TEMP/notarize/libwinemetalgl-x86_64.dylib"
          cp "$out/winemetalgl-$VERSION-x86_64/module/x86_64-unix/winemetalgl.so" "$RUNNER_TEMP/notarize/winemetalgl.so"
          cp "$out/winemetalgl-$VERSION-x86_64/module/x86_64-unix/x87sidecar" "$RUNNER_TEMP/notarize/x87sidecar"
          cp "$out/winemetalgl-$VERSION-arm64-core/lib/libwinemetalgl.dylib" "$RUNNER_TEMP/notarize/libwinemetalgl-arm64.dylib"
          cp "$out/winemetalgl-$VERSION-arm64/module/aarch64-unix/winemetalgl.so" "$RUNNER_TEMP/notarize/winemetalgl-arm64.so"
          cp "$out/winemetalgl-$VERSION-arm64/module/aarch64-unix/libwinemetalgl.dylib" "$RUNNER_TEMP/notarize/libwinemetalgl-arm64-module.dylib"
          for glue in "$out/winemetalgl-$VERSION-arm64-core"/glue/*/*.dylib; do
            game=$(basename "$(dirname "$glue")")
            cp "$glue" "$RUNNER_TEMP/notarize/glue-$game-$(basename "$glue")"
          done
          ditto -c -k --keepParent "$RUNNER_TEMP/notarize" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 1h --output-format json > "$RUNNER_TEMP/notary.json"
          status=$(plutil -extract status raw "$RUNNER_TEMP/notary.json")
          id=$(plutil -extract id raw "$RUNNER_TEMP/notary.json")
          echo "Notarization $id: $status"
          if test "$status" != Accepted; then
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          mkdir -p dist
          tar -czf "dist/winemetalgl-$VERSION-x86_64.tar.gz" -C "$out" "winemetalgl-$VERSION-x86_64"
          tar -czf "dist/winemetalgl-$VERSION-arm64-core.tar.gz" -C "$out" "winemetalgl-$VERSION-arm64-core"
          tar -czf "dist/winemetalgl-$VERSION-arm64.tar.gz" -C "$out" "winemetalgl-$VERSION-arm64"
          cp scripts/install-wine-module.sh scripts/install-crossover.sh dist/
          (cd dist && shasum -a 256 "winemetalgl-$VERSION-x86_64.tar.gz" "winemetalgl-$VERSION-arm64.tar.gz" \
            "winemetalgl-$VERSION-arm64-core.tar.gz" install-wine-module.sh install-crossover.sh > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="winemetalgl-$VERSION"
          notes=(--generate-notes)
          if test -f "docs/release-notes/$VERSION.md"; then notes=(--notes-file "docs/release-notes/$VERSION.md"); fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "WineMetalGL $VERSION" "${notes[@]}" \
            "dist/winemetalgl-$VERSION-x86_64.tar.gz" "dist/winemetalgl-$VERSION-arm64.tar.gz" \
            "dist/winemetalgl-$VERSION-arm64-core.tar.gz" \
            dist/install-wine-module.sh dist/install-crossover.sh dist/SHA256SUMS.txt

      # The settings app carries both, a whole runtime in its disk image; a
      # tarball keeps the modes (x87sidecar, the scripts) an artifact loses.
      - name: Keep the staged releases for the settings app
        run: tar -czf "$RUNNER_TEMP/staged.tar.gz" -C "$RUNNER_TEMP/out" "winemetalgl-$VERSION-x86_64" "winemetalgl-$VERSION-arm64-core"

      - name: Upload the staged releases
        uses: actions/upload-artifact@v4
        with:
          name: staged
          path: ${{ runner.temp }}/staged.tar.gz
          retention-days: 1

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/winemetalgl-signing.keychain-db" || true

  settings-app:
    name: WineMetalGL Settings ${{ needs.version.outputs.version }}
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    # Liquid Glass and the icon (actool) need Xcode 26.
    runs-on: macos-26
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch the staged releases
        uses: actions/download-artifact@v4
        with:
          name: staged
          path: ${{ runner.temp }}

      - name: Unpack the staged releases
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/staged.tar.gz" -C "$RUNNER_TEMP"
          echo "PAYLOAD=$RUNNER_TEMP/winemetalgl-$VERSION-x86_64" >> "$GITHUB_ENV"
          echo "ARM64_CORE=$RUNNER_TEMP/winemetalgl-$VERSION-arm64-core" >> "$GITHUB_ENV"

      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD; do
            test -n "${!name}" || { echo "missing secret $name"; exit 1; }
          done
          keychain="$RUNNER_TEMP/winemetalgl-signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A \
            -T /usr/bin/codesign -T /usr/bin/security -k "$keychain"
          rm -f "$RUNNER_TEMP/developer-id.p12"
          existing=()
          while read -r k; do
            k="${k//\"/}"
            [ -n "$k" ] && [ "$k" != "$keychain" ] || continue
            existing+=("$k")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application:/ {print $2; exit}')
          test -n "$identity" || { echo "the certificate holds no Developer ID Application identity"; exit 1; }
          echo "WINEMETALGL_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and sign the app
        run: |
          set -euo pipefail
          xcodebuild -version
          scripts/build-settings-app.sh "$RUNNER_TEMP/app"
          app="$RUNNER_TEMP/app/WineMetalGL Settings.app"
          test -f "$app/Contents/Resources/Installer/evidence/games/results.json" || { echo "the app lacks the x86_64 release"; exit 1; }
          test -f "$app/Contents/Resources/arm64-core/lib/libwinemetalgl.dylib" || { echo "the app lacks the arm64 core"; exit 1; }
          test -f "$app/Contents/Resources/arm64-core/glue/minecraft/libSDL3.dylib" || { echo "the app lacks the native games glue"; exit 1; }
          test -s "$app/Contents/Resources/Assets.car" || { echo "no Liquid Glass icon (actool)"; exit 1; }
          # The game fixes' Mach-O files and DLLs first, then the app; the
          # carried release keeps its signatures (scripts/stage-release.sh).
          scripts/sign-settings-app.sh "$app"
          find "$app/Contents/Resources" -name '*.dll' | while IFS= read -r dll; do
            codesign -dv "$dll" 2>&1 | grep -q "^TeamIdentifier=$APPLE_TEAM_ID\$" || { echo "not signed by the team: $dll"; exit 1; }
          done
          for f in "$app/Contents/Resources/GamePatches/SpaceEngine/winemac.so" \
                   "$app/Contents/Resources/Installer/module/x86_64-unix/libwinemetalgl.dylib" \
                   "$app/Contents/Resources/Installer/module/x86_64-unix/x87sidecar" \
                   "$app/Contents/Resources/arm64-core/lib/libwinemetalgl.dylib" "$app"; do
            codesign -dv "$f" 2>&1 | grep -q "^TeamIdentifier=$APPLE_TEAM_ID\$" || { echo "not signed by the team: $f"; exit 1; }
          done
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize and staple the app, then the disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          notarize() {
            xcrun notarytool submit "$1" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait --timeout 1h --output-format json > "$RUNNER_TEMP/notary.json"
            status=$(plutil -extract status raw "$RUNNER_TEMP/notary.json")
            id=$(plutil -extract id raw "$RUNNER_TEMP/notary.json")
            echo "Notarization of $(basename "$1") $id: $status"
            if test "$status" != Accepted; then
              xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
              exit 1
            fi
          }
          app="$RUNNER_TEMP/app/WineMetalGL Settings.app"
          dmg="$RUNNER_TEMP/WineMetalGL-Settings-$VERSION.dmg"
          # The app is stapled before it goes into the image, so a copy
          # dragged out of it opens offline too.
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/app.zip"
          notarize "$RUNNER_TEMP/app.zip"
          xcrun stapler staple "$app"
          scripts/build-settings-dmg.sh "$app" "$dmg"
          notarize "$dmg"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"
          # What WineMetalGL Settings checks before it installs an update.
          mnt="$RUNNER_TEMP/dmg-check"
          mkdir -p "$mnt"
          hdiutil attach "$dmg" -nobrowse -readonly -noautoopen -mountpoint "$mnt"
          requirement="anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\""
          codesign --verify --strict --deep "-R=$requirement" "$dmg"
          codesign --verify --strict --deep "-R=$requirement" "$mnt/WineMetalGL Settings.app"
          spctl --assess --type execute -vv "$mnt/WineMetalGL Settings.app"
          test -L "$mnt/Applications"
          hdiutil detach "$mnt"

      - name: Publish the disk image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="winemetalgl-$VERSION"
          name="WineMetalGL-Settings-$VERSION.dmg"
          # SHA256SUMS.txt lists the image before the image is up: the app
          # offers an update only once both are there.
          gh release download "$tag" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/sums" --clobber
          sums="$RUNNER_TEMP/sums/SHA256SUMS.txt"
          grep -v "  $name\$" "$sums" > "$sums.new" || true
          (cd "$RUNNER_TEMP" && shasum -a 256 "$name") >> "$sums.new"
          mv "$sums.new" "$sums"
          cat "$sums"
          gh release upload "$tag" "$sums" --clobber
          gh release upload "$tag" "$RUNNER_TEMP/$name" --clobber

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/winemetalgl-signing.keychain-db" || true
