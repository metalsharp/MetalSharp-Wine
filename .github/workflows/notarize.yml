name: Notarize release

# The app is built and signed (Developer ID, hardened runtime) on a Mac, then uploaded to a draft
# release as MetalSharp-Wine-<version>-<arch>.zip: arm64 (MetalSharp-Wine.app, with the provisioning
# profile) or x86_64 (MetalSharp-Wine-x86_64.app, scripts/package-x86_64.sh). This notarizes that zip
# with Apple, staples the ticket into the app, replaces the asset, and writes SHA256SUMS again from the release's
# assets as they are then (so runs for both apps, one after the other or not, leave it right for all of them).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v2.0)
        required: true
      arch:
        description: Which app to notarize
        type: choice
        options: [arm64, x86_64]
        default: arm64

# one run per release at a time: each rewrites the release's SHA256SUMS
concurrency:
  group: notarize-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notarize:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      ARCH: ${{ inputs.arch }}
    steps:
      - name: Download the signed app
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "MetalSharp-Wine-*-$ARCH.zip"
          ls -l
          echo "ZIP=$(ls MetalSharp-Wine-*-"$ARCH".zip)" >> "$GITHUB_ENV"
          if [ "$ARCH" = x86_64 ]; then echo "APP=MetalSharp-Wine-x86_64.app" >> "$GITHUB_ENV"; else echo "APP=MetalSharp-Wine.app" >> "$GITHUB_ENV"; fi

      - name: Check the signature
        run: |
          ditto -x -k "$ZIP" app
          codesign --verify --deep --strict "app/$APP"
          codesign -dv "app/$APP" 2>&1 | grep -E 'Authority=Developer ID|flags'

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$ZIP" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 2h --output-format json | tee result.json
          id=$(plutil -extract id raw result.json)
          xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" notary-log.json || true
          cat notary-log.json || true
          [ "$(plutil -extract status raw result.json)" = Accepted ]

      - name: Staple and repackage
        run: |
          # Apple's ticket service (CloudKit) sometimes drops the connection right after acceptance
          for i in 1 2 3 4 5 6; do xcrun stapler staple "app/$APP" && break; [ $i = 6 ] && exit 1; sleep 30; done
          xcrun stapler validate "app/$APP"
          spctl -a -vv "app/$APP"
          rm "$ZIP"
          ditto -c -k --keepParent "app/$APP" "$ZIP"

      - name: Upload the notarized app
        run: gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "$ZIP"

      # From every asset the release holds now, not a copy downloaded before: another run (the other app's) may have
      # replaced its zip since this one started. GitHub's digest of each asset, or the asset itself where it has none.
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .assets[] | select(.name != \"SHA256SUMS\") | [.name, (.digest // \"\")] | @tsv" |
          while IFS=$'\t' read -r name digest; do
            if [ -n "$digest" ]; then
              echo "${digest#sha256:}  $name"
            else
              echo "$(gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$name" -O - | shasum -a 256 | cut -d' ' -f1)  $name"
            fi
          done > SHA256SUMS
          cat SHA256SUMS
          [ -s SHA256SUMS ]
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber SHA256SUMS
