# winemac.conf: the GPU a game is shown in Windows' device list (SetupAPI, WMI, the display adapter's registry
# keys), by its executable's name; a game without a section is shown the Mac's own GPU. MetalSharp Wine reads
# $WINEMAC_CONFIG_FILE, else a winemac.conf next to mullion.conf (runtime/wine/etc), else this one.
#   gpu.vendorId / gpu.deviceId   PCI ids, in hex
#   gpu.description               the adapter's name
#   gpu.driverVersion             NVIDIA's driver number (617.14) or a Windows driver version (35.0.16.1714)
#
# Games whose DLSS (Mullion's, on MetalFX) needs an NVIDIA GPU and driver there; they also need Mullion to show
# them the same GPU (dxgi.customVendorId = 10de in mullion.conf).

# The Witcher 3 (Streamline): its launcher wants driver 617.14 or later
[witcher3.exe]
gpu.vendorId = 10de
gpu.deviceId = 2704
gpu.description = "NVIDIA GeForce RTX 4080"
gpu.driverVersion = 617.14

[REDprelauncher.exe]
gpu.vendorId = 10de
gpu.deviceId = 2704
gpu.description = "NVIDIA GeForce RTX 4080"
gpu.driverVersion = 617.14

# Control (NGX)
[Control_DX12.exe]
gpu.vendorId = 10de
gpu.deviceId = 2704
gpu.description = "NVIDIA GeForce RTX 4080"
gpu.driverVersion = 617.14
