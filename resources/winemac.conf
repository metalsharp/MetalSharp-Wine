# winemac.conf: the GPU a game is shown in Windows' device list (SetupAPI, WMI, the display adapter's registry
# keys), by its executable's name. MetalSharp Wine reads $WINEMAC_CONFIG_FILE, else a winemac.conf next to
# mullion.conf (runtime/wine/etc), else this one.
#   gpu.vendorId / gpu.deviceId   PCI ids, in hex
#   gpu.description               the adapter's name
#   gpu.driverVersion             NVIDIA's driver number (617.14) or a Windows driver version (35.0.16.1714)
#
# A game without a section is shown the Mac's own GPU, except a game on Mullion that comes with NVIDIA's DLSS
# (nvngx_dlss.dll) or Streamline (sl.interposer.dll): it is shown an NVIDIA GeForce RTX 4080 with driver 617.14,
# here and by Mullion, so DLSS runs on MetalFX. A section here takes precedence, for example to show a game
# another GPU, or the Mac's own one (Apple's vendor ID, 106b) to keep its DLSS off:
#
# [game.exe]
# gpu.vendorId = 106b
# gpu.deviceId = 03f1
